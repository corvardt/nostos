# Build the installable package and attach it to a GitHub release.
#
# Not PyPI. The only thing an index would add is resolution by name, and it
# costs two accounts, a trusted-publisher configuration, and the rule that a
# version number can never be reused. A release asset installs exactly as well:
#
#   uv tool install <url of the wheel>
#
# Running this by hand builds and checks without releasing, which is how to
# rehearse before tagging.

name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Before the wheel, always. A package built without this installs
      # cleanly, starts, and serves a 503 where the interface should be.
      - name: "Assemble the package: interface and readme"
        run: ./scripts/build-package.sh

      - name: Build the wheel and sdist
        run: pipx run build --wheel --sdist --outdir dist backend

      - name: Refuse to release an artifact with no interface in it
        run: |
          python - <<'PY'
          import glob, sys, tarfile, zipfile

          def check(path, names):
              count = sum("/static/" in n for n in names)
              if not any(n.endswith("static/index.html") for n in names):
                  sys.exit(f"{path} contains no built interface")
              print(f"{path}: {count} interface files")

          for whl in glob.glob("dist/*.whl"):
              check(whl, zipfile.ZipFile(whl).namelist())
          for sdist in glob.glob("dist/*.tar.gz"):
              with tarfile.open(sdist) as tar:
                  check(sdist, tar.getnames())
          PY

      # The wheel is the thing people install, so install it: a package that
      # builds but does not start is not caught by any amount of unit testing.
      - name: Check the wheel installs and runs
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          /tmp/check/bin/nostos --version
          NOSTOS_DATA_DIR=/tmp/check-data /tmp/check/bin/nostos doctor

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Deliberately not an editable install. Editable mode goes through PEP
      # 660's separate hooks, which is where `prepare_metadata_for_build_editable`
      # blows up on an older hatchling - and nothing here needs the indirection.
      - run: pip install ".[dev]"
      - run: python -m pytest -q

  attach:
    needs: [build, test]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to add assets to the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Attach the wheel and sdist to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber -R "${{ github.repository }}"
