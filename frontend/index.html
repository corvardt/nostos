<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./assets/down.png" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#dedee0" media="(prefers-color-scheme: light)" />
    <title>Nostos</title>
    <script>
      // Resolve the medium before first paint so the tube never flashes on paper.
      // The cookie is set on `.unmod.fun`, so the choice is shared with the
      // other instruments; localStorage is read only for returning readers.
      (function () {
        var c = document.cookie.match(/(?:^|;\s*)unmod-theme=(dark|light)/);
        var t = (c && c[1]) || localStorage.getItem('nostos-theme');
        if (t !== 'dark' && t !== 'light') {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
