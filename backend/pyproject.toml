[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The import package and the command are both `nostos`; only the distribution
# carries the suffix, because plain `nostos` on PyPI belongs to an unrelated
# project. Nothing a user types is affected except the install line itself.
name = "nostos-app"
version = "0.1.0"
description = "Paste a link, get the file. Archive whole music accounts. Entirely on your own machine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "corvardt" }]
keywords = ["yt-dlp", "downloader", "music", "archive", "spotify", "apple-music", "deezer"]
classifiers = [
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]

dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "yt-dlp",
  "pydantic>=2",

  # Library sync talks to Apple Music and Deezer over plain HTTP.
  "httpx",

  # Writes the artist, album and ISRC the music service reported over whatever
  # YouTube supplied, so an archived track is tagged from a catalogue rather
  # than from a video title.
  "mutagen",

  # Spotify is the only library source needing a client library, for its OAuth
  # flow. Without it every other source still works.
  "spotipy",

  # Required on Linux to decrypt Chromium-family cookie stores (Chrome, Brave,
  # Chromium, Edge, Opera, Vivaldi) via the OS keyring. Firefox does not need it.
  "secretstorage; sys_platform == 'linux'",
]

[project.optional-dependencies]
# spotdl resolves a track to a video against Spotify's own catalogue, which
# beats a YouTube search. Large, and entirely optional: without it the built-in
# scorer does the job.
spotdl = ["spotdl"]

# An extra rather than a PEP 735 dependency group, so that plain `pip install
# -e ".[dev]"` works without needing a recent pip or uv.
dev = ["pytest", "httpx", "build"]

[project.scripts]
nostos = "nostos.cli:main"
nostos-library = "nostos.library.cli:main"

[project.urls]
Homepage = "https://github.com/corvardt/nostos"
Issues = "https://github.com/corvardt/nostos/issues"

[tool.hatch.build.targets.wheel]
packages = ["nostos"]

# The built interface is generated by scripts/build-ui.sh and gitignored, so it
# has to be named explicitly or the build backend leaves it out of the wheel.
artifacts = ["nostos/static/**"]

[tool.hatch.build.targets.sdist]
# README.md is a symlink to the repository's, so the PyPI page and the GitHub
# page cannot drift apart. It has to be listed here or an sdist would not carry
# the file its own metadata refers to.
include = ["nostos", "tests", "pyproject.toml", "README.md"]

# Same reason as the wheel: the interface is gitignored, so without this an
# sdist install (`pip install --no-binary :all:`) would quietly have no UI.
artifacts = ["nostos/static/**"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
